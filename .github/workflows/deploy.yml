name: Deploy Lili Figurin Landing Page

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PATH || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/byronmoreno/lilifigurin:${{ github.sha }}
            ghcr.io/byronmoreno/lilifigurin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-create deploy directory on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/lilifigurin

      - name: Copy stack.yml and Makefile to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml,Makefile"
          target: "/home/${{ secrets.VPS_USER }}/lilifigurin"

      - name: Execute Swarm Deployment on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🚀 Iniciando despliegue de LiliFigurin en Swarm"
            cd /home/${{ secrets.VPS_USER }}/lilifigurin
            
            echo "${{ secrets.GHCR_PATH || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Descargando última imagen"
            docker pull ghcr.io/byronmoreno/lilifigurin:latest
            
            echo "🔄 Desplegando stack lilifigurin"
            docker stack deploy --with-registry-auth --resolve-image always -c stack.yml lilifigurin
            docker service update --force --image ghcr.io/byronmoreno/lilifigurin:latest lilifigurin_web
            
            echo "✅ ¡Despliegue de lili.byronrm.com completado con éxito!"
